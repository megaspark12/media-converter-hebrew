name: Android CI

on:
  push:
  pull_request:

jobs:
  build-and-static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Unit tests, lint, and debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Verify 16 KB APK alignment
        run: "$ANDROID_HOME/build-tools/36.0.0/zipalign -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: media-converter-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  deterministic-device-tests:
    # GitHub's Apple-silicon macOS runners expose no Hypervisor.framework, so an
    # arm64 emulator can never boot there (HVF error: HV_UNSUPPORTED). Linux
    # runners expose KVM, so the suite runs on x86_64 images; the debug build
    # type packages x86_64 native libs for exactly this purpose.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 29, 34]
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 900
          script: ./gradlew connectedDebugAndroidTest
