name: Android CI

on:
  push:
  pull_request:

jobs:
  build-and-static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Unit tests, lint, and debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Verify 16 KB APK alignment
        run: "$ANDROID_HOME/build-tools/36.0.0/zipalign -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: media-converter-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  deterministic-device-tests:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 29, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: arm64-v8a
          target: google_apis
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest
