name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_live:
        description: Run live MP4/MP3 conversion and the app download-button flow
        type: boolean
        default: false

jobs:
  build-and-static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Unit tests, lint, and debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Verify 16 KB APK alignment
        run: "$ANDROID_HOME/build-tools/36.0.0/zipalign -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk"
      - name: Verify the release APK ships only arm64-v8a
        # The debug build type adds x86_64 so CI emulators can run the native stack; this
        # guards the distribution policy so release never silently picks it up.
        run: |
          ./gradlew assembleRelease
          abis=$(unzip -Z1 app/build/outputs/apk/release/app-release-unsigned.apk | grep '^lib/' | cut -d/ -f2 | sort -u | tr '\n' ' ')
          echo "release ABIs: $abis"
          test "$abis" = "arm64-v8a "
      - uses: actions/upload-artifact@v4
        with:
          name: media-converter-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  deterministic-device-tests:
    # GitHub's Apple-silicon macOS runners are VMs without nested virtualization,
    # so an arm64 emulator can never boot there (HVF error: HV_UNSUPPORTED).
    # Linux runners expose KVM, so the suite runs on x86_64 images; the debug
    # build type packages x86_64 native libs for exactly this purpose.
    runs-on: ubuntu-latest
    # The previous failure mode was three legs hanging to GitHub's 6-hour default
    # on every push for weeks; a passing leg takes well under an hour.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 29, 34, 36]
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 900
          script: ./gradlew connectedDebugAndroidTest
      - name: Live provider smoke test (manual opt-in)
        if: ${{ inputs.run_live && matrix.api-level == 36 }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 900
          script: ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.mediaconverter.app.LiveConversionSmokeTest,com.mediaconverter.app.LiveDownloadFlowInstrumentedTest -Pandroid.testInstrumentationRunnerArguments.runLive=true -Pandroid.testInstrumentationRunnerArguments.runLiveFlow=true
      - name: Upload instrumented test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports-api${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
