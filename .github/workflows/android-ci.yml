name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_live:
        description: Run live MP4/MP3 conversion and the app download-button flow
        type: boolean
        default: false

jobs:
  build-and-static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Unit tests, lint, and debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Verify 16 KB APK alignment
        run: "$ANDROID_HOME/build-tools/36.0.0/zipalign -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: media-converter-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  deterministic-device-tests:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 29, 34, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: arm64-v8a
          target: google_apis
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest
      - name: Live provider smoke test (manual opt-in)
        if: ${{ inputs.run_live && matrix.api-level == 36 }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: arm64-v8a
          target: google_apis
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.mediaconverter.app.LiveConversionSmokeTest,com.mediaconverter.app.LiveDownloadFlowInstrumentedTest -Pandroid.testInstrumentationRunnerArguments.runLive=true -Pandroid.testInstrumentationRunnerArguments.runLiveFlow=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-results-api-${{ matrix.api-level }}
          path: app/build/outputs/androidTest-results/connected/
